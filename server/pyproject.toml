[project]
name = "rib-pqc-auth-service"
version = "0.1.0"
description = "Implementing PQC: Auth-Service mit Identity-Broker und Post-Quantum-Crypto-Layer"
readme = "README.md"
requires-python = ">=3.12"
authors = [
    { name = "Dodoe Mannale", email = "dodoe.mannale@heks.ch" },
]
license = { text = "MIT" }

dependencies = [
    "fastapi[standard] >=0.115,<0.120",
    "uvicorn[standard] >=0.32,<0.35",
    "pydantic >=2.9,<3.0",
    "pydantic-settings >=2.6,<3.0",
    "structlog >=24.4,<26.0",
    "pyyaml >=6.0,<7.0",
    "liboqs-python >=0.12,<1.0",
    "sqlalchemy[asyncio] >=2.0,<3.0",
    "aiosqlite >=0.20,<0.22",
    "alembic >=1.13,<2.0",
    "argon2-cffi >=23.1,<24.0",
    "slowapi >=0.1.9,<0.2",
    "redis >=5.0,<7.0",
    "pyjwt[crypto] >=2.10,<3.0",
    "httpx >=0.27,<0.30",
]

[project.optional-dependencies]
dev = [
    "ruff >=0.7,<0.10",
    "mypy >=1.13,<2.0",
    "pytest >=8.3,<9.0",
    "pytest-asyncio >=0.24,<0.30",
    "pytest-cov >=5.0,<7.0",
    "httpx >=0.27,<0.30",
    "types-pyyaml >=6.0,<7.0",
    "fakeredis >=2.20,<3.0",
    "respx >=0.21,<1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]
only-include = [
    "main.py",
    "admin.py",
    "config.py",
    "logging_config.py",
    "routers",
    "crypto",
    "services",
    "models",
    "db",
    "auth",
    "middleware",
    "idp",
    "config.yaml",
    "alembic",
    "alembic.ini",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["."]
extend-exclude = [
    ".venv",
    "__pycache__",
    "build",
    "dist",
    "alembic/versions",
]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF", "S", "ASYNC"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]
"alembic/**" = ["E501", "S105", "S106"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
pretty = true
show_error_codes = true
files = ["main.py", "admin.py", "config.py", "logging_config.py", "routers", "services", "models", "db", "auth", "middleware", "idp"]

[[tool.mypy.overrides]]
module = ["structlog.*"]
ignore_missing_imports = false

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
asyncio_mode = "auto"
# PQC-63 QUA-1 (AC-3 + AC-4): default-Run laeuft mit Coverage. --cov-report=term
# zeigt eine Zusammenfassung im Terminal, --cov-report=html generiert htmlcov/
# fuer Detail-Lookup. Threshold (--cov-fail-under) ist bewusst NICHT gesetzt:
# in Sprint 1 sind viele Infra-Module noch ohne Tests (logging_config, db/engine,
# crypto/keys), und liboqs-Skips senken den Sandbox-Wert. Globales Threshold
# wird in Sprint 4 (Doku-Polish) nach Coverage-Stabilisierung gesetzt.
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--cov=.",
    "--cov-report=term-missing:skip-covered",
    "--cov-report=html",
]

# PQC-63 QUA-1 AC-4: Coverage-Config. Source-Pfade, Exclusions, Report-Format.
[tool.coverage.run]
branch = true
source = ["."]
omit = [
    "tests/*",
    "alembic/*",
    "__pycache__/*",
    ".venv/*",
    "build/*",
    "dist/*",
]

[tool.coverage.report]
# Linien mit '# pragma: no cover' werden ausgeschlossen, plus typische
# Boilerplate-Patterns die nicht sinnvoll testbar sind.
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "\\.\\.\\.",
]
show_missing = true
skip_covered = false
precision = 1

[tool.coverage.html]
directory = "htmlcov"

[tool.uv]
package = true
dev-dependencies = [
    "ruff >=0.7,<0.10",
    "mypy >=1.13,<2.0",
    "pytest >=8.3,<9.0",
    "pytest-asyncio >=0.24,<0.30",
    "pytest-cov >=5.0,<7.0",
    "httpx >=0.27,<0.30",
    "types-pyyaml >=6.0,<7.0",
    "fakeredis >=2.20,<3.0",
    "respx >=0.21,<1.0",
]
