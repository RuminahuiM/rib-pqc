[project]
name = "rib-pqc-auth-service"
version = "0.1.0"
description = "Implementing PQC: Auth-Service mit Identity-Broker und Post-Quantum-Crypto-Layer"
readme = "README.md"
requires-python = ">=3.12"
authors = [
    { name = "Dodoe Mannale", email = "dodoe.mannale@heks.ch" },
]
license = { text = "MIT" }

# Runtime dependencies fuer SKL-1 (FastAPI-Skeleton mit Config-Loading).
# Weitere Dependencies werden in spaeteren Stories ergaenzt:
#   - argon2-cffi (PQC-28 AUT-1)
#   - liboqs-python (PQC-25 CRY-5)
#   - SQLAlchemy plus Alembic (PQC-28 AUT-1)
#   - redis (PQC-3 Session-Stories)
#   - authlib plus httpx (Sprint 2 Broker-Stories)
dependencies = [
    "fastapi[standard] >=0.115,<0.120",
    "uvicorn[standard] >=0.32,<0.35",
    "pydantic >=2.9,<3.0",
    "pydantic-settings >=2.6,<3.0",
    "structlog >=24.4,<26.0",
    "pyyaml >=6.0,<7.0",
    "liboqs-python >=0.12,<1.0",
]

[project.optional-dependencies]
dev = [
    "ruff >=0.7,<0.10",
    "mypy >=1.13,<2.0",
    "pytest >=8.3,<9.0",
    "pytest-asyncio >=0.24,<0.30",
    "httpx >=0.27,<0.30",
    "types-pyyaml >=6.0,<7.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]
only-include = [
    "main.py",
    "config.py",
    "logging_config.py",
    "routers",
    "crypto",
    "services",
    "config.yaml",
]

# ---------------------------------------------------------------------------
# ruff: Linter und Formatter (ersetzt flake8 plus black)
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["."]
extend-exclude = [
    ".venv",
    "__pycache__",
    "build",
    "dist",
]

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "B",
    "UP",
    "SIM",
    "RUF",
    "S",
    "ASYNC",
]
ignore = [
    "S101",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
pretty = true
show_error_codes = true
files = ["main.py", "config.py", "logging_config.py", "routers", "services"]

[[tool.mypy.overrides]]
module = ["structlog.*"]
ignore_missing_imports = false

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
]

[tool.uv]
package = true
dev-dependencies = [
    "ruff >=0.7,<0.10",
    "mypy >=1.13,<2.0",
    "pytest >=8.3,<9.0",
    "pytest-asyncio >=0.24,<0.30",
    "httpx >=0.27,<0.30",
    "types-pyyaml >=6.0,<7.0",
]
