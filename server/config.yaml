# Default-Konfiguration fuer den Auth-Service (Stories PQC-19 / SKL-1 und PQC-21 / CRY-1).
#
# Diese YAML-Datei ist nicht-geheim und liegt im Repo. Geheime Werte (z.B.
# OIDC Client Secrets) gehoeren in eine .env-Datei und werden via Environment
# geladen. Pro Tech-Stack-Doku Abschnitt 2.5.
#
# Override-Reihenfolge (von schwach nach stark):
#   1. Defaults in config.py (Pydantic-Default-Werte)
#   2. Werte aus dieser YAML-Datei
#   3. Werte aus .env-Datei
#   4. Environment-Variablen
#
# Spaetere Sprint-Stories fuegen hier weitere Sections hinzu, z.B.:
#   idp_providers.google, idp_providers.microsoft (Sprint 2 Broker-Stories)

app_name: "rib-pqc-auth-service"
version: "0.1.0"
environment: "dev"

# HTTP-Server (uvicorn). Container-internen Port 8000 nicht aendern, der nginx
# Upstream in infra/nginx/nginx.conf verweist explizit auf auth-service:8000.
host: "0.0.0.0"
port: 8000

# Logging (Story PQC-19 AC-5). Wertebereich: debug, info, warning, error, critical.
log_level: "info"

# Datenspeicher. Pfade gelten innerhalb des Containers, ueber die Volumes
# auth-data und redis-data persistiert. Werden in spaeteren Sprint-Stories
# tatsaechlich verwendet (AUT-1 fuer SQLite, Session-Stories fuer Redis).
sqlite_path: "/data/auth.sqlite"
redis_url: "redis://redis:6379/0"

# Crypto-Algorithmus-Registry (Story PQC-21 / CRY-1, AC-4).
# Pro Algorithmus-Klasse sind 'supported' die registrierten Plugins,
# 'default' der Standard-Algorithmus fuer Operationen ohne explizite Wahl.
# Mit der Crypto-Agility-Architektur ist ein Wechsel des default-Algorithmus
# eine reine Config-Aenderung, kein Code-Eingriff.
crypto:
  kem:
    supported:
      - "ML-KEM-768"
    default: "ML-KEM-768"
  signature:
    supported:
      - "ML-DSA-65"
    default: "ML-DSA-65"
    # PQC-25 (CRY-5) AC-5: Key-Persistierung.
    # In Dev wird beim ersten Service-Start auto-keygen plus save gemacht.
    # In Production muss ein vorgenerierter Key im Volume liegen.
    private_key_path: "/data/keys/auth_signing_key.bin"
    public_key_path: "/data/keys/auth_signing_key.pub"
    # PQC-25 Review K-3: explizites Flag fuer Auto-Keygen in Dev. In Production-
    # Configs auf false setzen (oder Feld weglassen, Default ist false).
    allow_autogen_in_dev: true
    # PQC-22 (CRY-2): kid den die Facade in ``sign``-Antworten mitliefert und
    # bei ``verify`` zum Public-Key-Lookup nutzt.
    signing_kid: "auth-signing-key-v1"

# Token-Layer (Story PQC-32 / TOK-1, erweitert in PQC-33 / TOK-2).
# Broker-Token-Ausstellung und -Verifikation im JWS-Compact-Format mit ML-DSA-65.
token:
  # iss-Claim. Identifiziert den Aussteller des Tokens fuer Empfaenger.
  # Bewusst nicht an app_name gebunden (Rename-Resistenz).
  issuer: "pqc-auth-service"
  # Time-to-Live in Sekunden (exp = iat + ttl_seconds).
  ttl_seconds: 3600
  # PQC-33 AC-6: Allowlist erlaubter alg-Werte beim Verify (case-insensitive).
  # RFC 8725 BCP Schutz gegen alg-confusion plus alg=none. Liste statt String
  # damit Algorithmus-Migration in einer Uebergangs-Phase parallel beide
  # zulassen kann.
  allowed_algs:
    - "ML-DSA-65"
  # PQC-33 AC-3: Clock-Skew-Toleranz bei exp-Check. 30s ist konservativer
  # Best-Practice-Sweet-Spot fuer NTP-synchronisierte Container.
  exp_leeway_seconds: 30

# Argon2id Password-Hashing (Story PQC-28 / AUT-1 AC-4).
# Story-AC-4 Default: m=64MB t=3 p=4. Sicherer als OWASP-2024-Sweet-Spot.
# Tuning-Hinweis: bei zu langsamem Login koennen die Werte reduziert werden
# auf OWASP-2024 (memory_cost_kb: 46000, time_cost: 1, parallelism: 1). Vor
# Reduktion Sicherheits-Tradeoff dokumentieren.
argon2:
  memory_cost_kb: 65536
  time_cost: 3
  parallelism: 4
  salt_length: 16
  hash_length: 32

# Database-Konfiguration (Story PQC-28 / AUT-1 AC-2, AC-3).
# Application nutzt async_url (aiosqlite). Alembic nutzt sync_url
# (Standard sqlite3) fuer Migrations. Beide URLs zeigen auf /data/auth.sqlite,
# der ueber das auth-data Volume persistiert wird.
database:
  async_url: "sqlite+aiosqlite:////data/auth.sqlite"
  sync_url: "sqlite:////data/auth.sqlite"
  echo: false
