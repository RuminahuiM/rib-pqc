# nginx Placeholder-Konfiguration fuer Sprint 1 (Story PQC-17 INF-3)
#
# Diese Konfiguration nutzt stock nginx:1.27-alpine ohne TLS. Sie wird in
# PQC-18 (INF-4) durch einen Custom-Build auf openquantumsafe/oqs-ossl3 ersetzt,
# der TLS 1.3 mit hybrider Cipher-Suite X25519MLKEM768 auf Port 443 anbietet.

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    sendfile        on;
    tcp_nopush      on;
    keepalive_timeout 65;

    upstream auth_service {
        server auth-service:8000;
    }

    log_format pqc_main '$remote_addr - $remote_user [$time_local] '
                       '"$request" $status $body_bytes_sent '
                       '"$http_referer" "$http_user_agent"';

    access_log /var/log/nginx/access.log pqc_main;
    error_log  /var/log/nginx/error.log warn;

    server {
        listen 80 default_server;
        server_name _;

        # Reverse-Proxy zum auth-service. Catch-all, weil der Endpoint-Set
        # erst in spaeteren Sprints konkret ausgebaut wird.
        location / {
            proxy_pass         http://auth_service;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_connect_timeout 5s;
            proxy_read_timeout    30s;
        }
    }
}
