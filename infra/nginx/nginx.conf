# nginx-Konfiguration fuer pqc-nginx Image
# Stories: PQC-17 (INF-3 HTTP Reverse-Proxy), PQC-18 (INF-4 TLS mit X25519MLKEM768)
#
# Sprint-1 Endspurt: zwei Listen-Blocks parallel:
#  - Port 80: HTTP-Reverse-Proxy zu auth-service (Sprint-1-Login-Flow ohne TLS,
#    bleibt fuer Tests und Sprint-2-Anpassungen aktiv)
#  - Port 443: TLS 1.3 mit Hybrid X25519MLKEM768 Smoke-Endpoint + Health
#    (Sprint-2 PQC-45 TLS-3 wird das Routing zu auth-service auch auf 443
#    aktivieren; aktuell nur /pqc-test und /health auf 443).

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    sendfile        on;
    tcp_nopush      on;
    keepalive_timeout 65;

    upstream auth_service {
        server auth-service:8000;
    }

    # $ssl_curve: ausgehandelte Key-Exchange-Gruppe (X25519MLKEM768 bei
    # PQ-Hybrid). Je nach nginx/OpenSSL-Version erscheinen externe
    # oqs-provider-Gruppen als Hex-ID 0x11ec statt Name (nginx Issue #606),
    # 0x11ec IST die IANA-Codepoint-ID von X25519MLKEM768. Kolloquium-Beweis.
    log_format pqc_main '$remote_addr - $remote_user [$time_local] '
                        '"$request" $status $body_bytes_sent '
                        '"$ssl_protocol" "$ssl_cipher" "$ssl_curve" '
                        '"$http_user_agent"';

    access_log /opt/nginx/logs/access.log pqc_main;
    error_log  /opt/nginx/logs/error.log warn;

    # -----------------------------------------------------------------------
    # Server 1: HTTP-Reverse-Proxy auf Port 80 (PQC-17 INF-3, Sprint-1-Flow)
    # -----------------------------------------------------------------------

    server {
        listen 80 default_server;
        server_name _;

        location / {
            proxy_pass         http://auth_service;
            proxy_http_version 1.1;
            # Backend sieht immer den Backend-Namen als Host. TrustedHostMiddleware
            # in auth-service kennt "auth-service" in der Allowlist, nicht das
            # Client-supplied "nginx" oder "localhost". Der originale Client-Host
            # ist via X-Forwarded-Host verfuegbar falls das Backend ihn braucht
            # (Reverse-Proxy-Standard, F-139 aus Demo-D008-Debug).
            proxy_set_header   Host              "auth-service:8000";
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   X-Forwarded-Host  $host;
            proxy_connect_timeout 5s;
            proxy_read_timeout    30s;
        }
    }

    # -----------------------------------------------------------------------
    # Server 2: TLS 1.3 mit X25519MLKEM768 auf Port 443 (PQC-18 INF-4 AC-5)
    # -----------------------------------------------------------------------

    server {
        listen 443 ssl;
        server_name _;
        # http2 wird Sprint-2-Polish (PQC-43 TLS-1). Aktuell nicht aktiviert
        # weil nginx ohne --with-http_v2_module gebaut wurde. Fuer PQC-18
        # Story-AC-5 (X25519MLKEM768 Handshake) ist HTTP/2 nicht erforderlich.

        # Self-signed Test-Cert aus dem Build (Subject-Alg: ML-DSA-65 FIPS 204)
        ssl_certificate     /opt/nginx/pki/server.crt;
        ssl_certificate_key /opt/nginx/pki/server.key;

        # TLS 1.3 only. Aeltere Versionen unterstuetzen kein PQC-Hybrid-KEM.
        ssl_protocols TLSv1.3;

        # ECDH-Kurven inklusive PQC-Hybrid X25519MLKEM768.
        # nginx mappt das in OpenSSL auf "groups", weil oqs-provider die
        # hybriden KEMs als Groups in TLS 1.3 anbietet.
        ssl_ecdh_curve X25519MLKEM768:X25519:secp384r1:prime256v1;

        # Session-Optimierungen
        ssl_session_cache    shared:SSL:10m;
        ssl_session_timeout  10m;
        ssl_session_tickets  off;

        # PQC-18-AC-5 Smoke-Endpoint: liefert TLS-Info ueber Server-Variablen.
        # Bleibt erhalten weil das ein nginx-internal-Endpoint fuer Cert-/TLS-
        # Verifikation ist und NICHT an auth-service durchgereicht werden soll.
        location /pqc-test {
            default_type text/plain;
            return 200 "pqc-nginx TLS handshake OK\nProtocol: $ssl_protocol\nCipher: $ssl_cipher\n";
        }

        # PQC-45 (TLS-3): Reverse-Proxy zu auth-service via 443.
        # Alle Requests (inkl. /health, /auth/*, /auth/federated/*) werden
        # an FastAPI auf Port 8000 weitergegeben. X-Forwarded-* Header
        # damit auth-service die echte Client-IP sieht (PQC-83 F-048 verlangt
        # das fuer Per-IP-Rate-Limit).
        location / {
            proxy_pass         http://auth_service;
            proxy_http_version 1.1;
            # Backend sieht immer den Backend-Namen als Host (F-139 aus
            # Demo-D008-Debug). Original Client-Host via X-Forwarded-Host.
            proxy_set_header   Host              "auth-service:8000";
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto https;
            proxy_set_header   X-Forwarded-Host  $host;
            # PQC-45 AC-3: TLS-Metadata fuer auth-service-Logs/Audit.
            proxy_set_header   X-TLS-Protocol    $ssl_protocol;
            proxy_set_header   X-TLS-Cipher      $ssl_cipher;
            proxy_connect_timeout 5s;
            proxy_read_timeout    30s;
        }
    }
}
