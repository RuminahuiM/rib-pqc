# Implementing PQC - Docker Compose Skeleton
# ------------------------------------------------------------------
# Stories: PQC-17 (INF-3, Compose-Skeleton), PQC-19 (SKL-1, FastAPI-Skeleton)
# Bezug: docs/07_design.md Abschnitt 3.1, docs/06_tech_stack.md Abschnitt 2.1
#
# Status Sprint 1:
#   - Drei Services laufen: nginx (Placeholder, stock), auth-service (FastAPI), redis.
#   - nginx ist stock nginx:1.27-alpine ohne TLS und ohne oqs-provider.
#     Der Custom-Build mit OpenSSL 3.5 plus oqs-provider folgt in PQC-18 (INF-4).
#   - auth-service ist das echte FastAPI-Skeleton aus ../server mit /health-Endpoint
#     und JSON-Logging. Folge-Stories (AUT, TOK, CRY, ...) bauen darauf auf.
#   - Persistente Volumes auth-data und redis-data sind angelegt.
#
# Quickstart:
#   cd infra
#   cp .env.example .env
#   docker compose up --build
#   curl http://localhost:8080/health       # JSON vom FastAPI: {"status":"ok","version":"..."}
#   curl http://localhost:8080/docs         # FastAPI Swagger-UI ueber nginx
# ------------------------------------------------------------------

name: pqc

services:

  # ----------------------------------------------------------------
  # nginx - PQC-faehiger Reverse Proxy (Story PQC-18 INF-4)
  # Custom Multi-Stage Build mit OpenSSL 3.5 + liboqs + oqs-provider + nginx 1.27.
  # Aktiviert TLS 1.3 mit X25519MLKEM768 (Hybrid PQC) auf Port 443. Port 8080
  # bleibt fuer den HTTP-Fallback (Sprint-1 Login-Flow ueber HTTP).
  # ----------------------------------------------------------------
  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile.nginx
    image: rib-pqc-nginx:0.1
    container_name: pqc-nginx
    restart: unless-stopped
    ports:
      - "${NGINX_HTTP_PORT:-8080}:80"
      - "${NGINX_HTTPS_PORT:-8443}:443"
    volumes:
      # Master-nginx-Config mit HTTP (Port 80) + TLS (Port 443 mit X25519MLKEM768)
      - ./nginx/nginx.conf:/opt/nginx/conf/nginx.conf:ro
    depends_on:
      auth-service:
        condition: service_healthy
    networks:
      - pqc-net
    healthcheck:
      # Healthcheck nutzt die DockerFile-Default-Healthcheck (pgrep nginx +
      # openssl list -providers | grep oqsprovider). Hier compose-Overlay mit
      # zusaetzlichem /pqc-test-Test via openssl s_client moeglich, aber wir
      # vertrauen dem Dockerfile-Healthcheck fuer den Standard-Lauf.
      test: ["CMD-SHELL", "pgrep nginx >/dev/null && openssl list -providers 2>/dev/null | grep -q oqsprovider"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ----------------------------------------------------------------
  # auth-service - FastAPI Skeleton (Story PQC-19 / SKL-1)
  # Build-Kontext zeigt auf ../server, dort liegen Dockerfile, pyproject.toml,
  # main.py, config.py, routers/health.py etc.
  # ----------------------------------------------------------------
  auth-service:
    build:
      context: ../server
      dockerfile: Dockerfile
    image: rib-pqc-auth-service:dev
    container_name: pqc-auth-service
    restart: unless-stopped
    volumes:
      - auth-data:/data
    environment:
      # Settings-Override via Pydantic-Settings (Praefix RIB_).
      RIB_REDIS_URL: redis://redis:6379/0
      RIB_SQLITE_PATH: /data/auth.sqlite
      RIB_LOG_LEVEL: info
      RIB_ENVIRONMENT: dev
      # PQC-84 BRK-0 + PQC-36 BRK-1: IdP-Credentials via Pydantic-Settings-Nested.
      # Compose substituiert aus ../infra/.env (nicht ins Git committet).
      # Fallback-Values leer, damit compose bei fehlendem .env nicht crashed;
      # F-058 fail-fast validation im init_idp_registry meldet dann klar was fehlt.
      RIB_IDP_PROVIDERS__GOOGLE__CLIENT_ID: "${GOOGLE_OAUTH_CLIENT_ID:-}"
      RIB_IDP_PROVIDERS__GOOGLE__CLIENT_SECRET: "${GOOGLE_OAUTH_CLIENT_SECRET:-}"
      RIB_IDP_PROVIDERS__MICROSOFT__CLIENT_ID: "${MICROSOFT_OAUTH_CLIENT_ID:-}"
      RIB_IDP_PROVIDERS__MICROSOFT__CLIENT_SECRET: "${MICROSOFT_OAUTH_CLIENT_SECRET:-}"
      RIB_IDP_PROVIDERS__MICROSOFT__TENANT_ID: "${MICROSOFT_OAUTH_TENANT_ID:-}"
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - pqc-net
    healthcheck:
      # FastAPI /health-Endpoint (PQC-19 AC-3).
      test:
        - "CMD"
        - "python"
        - "-c"
        - "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health',timeout=2).status==200 else 1)"
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  # ----------------------------------------------------------------
  # auth-service-test - Integration-Test-Runner (PQC-66/67 QUA-4/5)
  # ----------------------------------------------------------------
  # Nutzt Dockerfile-target=test (Multi-Stage-Build). Beinhaltet dev-deps
  # (pytest, respx, fakeredis, ...) plus das tests/ Verzeichnis. Prod-Image
  # (auth-service) bleibt schlank ohne dev-deps.
  #
  # Ausfuehrung (aus infra/):
  #     docker compose build auth-service-test
  #     docker compose run --rm auth-service-test
  #
  # Der Container startet direkt pytest (CMD im Dockerfile), depends_on redis
  # damit Integration-Tests einen echten Redis fuer fakeredis-freie Runs
  # nutzen koennen. Restart: no (das ist ein one-shot Test-Runner).
  auth-service-test:
    build:
      context: ../server
      dockerfile: Dockerfile
      target: test
    image: rib-pqc-auth-service:test
    container_name: pqc-auth-service-test
    profiles: ["test"]  # Nur bei explizitem --profile test oder docker compose run gestartet
    environment:
      RIB_REDIS_URL: redis://redis:6379/0
      RIB_SQLITE_PATH: /tmp/test-auth.sqlite
      RIB_LOG_LEVEL: warning
      RIB_ENVIRONMENT: dev
      # Test-Umgebung: rate-limit off + memory-storage damit die Tests
      # nicht durch die 60/min-Global-Rate blockiert werden.
      RIB_SECURITY__RATE_LIMIT__ENABLED: "false"
      RIB_SECURITY__RATE_LIMIT__STORAGE_URI: "memory://"
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - pqc-net

  # ----------------------------------------------------------------
  # redis - Session-Store
  # Sprint 1: stock redis:7-alpine mit AOF Persistenz auf redis-data Volume.
  # ----------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: pqc-redis
    restart: unless-stopped
    command:
      - "redis-server"
      - "--appendonly"
      - "yes"
      - "--appendfsync"
      - "everysec"
    volumes:
      - redis-data:/data
    networks:
      - pqc-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 3s

# ------------------------------------------------------------------
# Volumes - persistente Datenhaltung ueber Container-Restarts
# ------------------------------------------------------------------
volumes:
  auth-data:
    name: pqc-auth-data
  redis-data:
    name: pqc-redis-data

# ------------------------------------------------------------------
# Networks - eigenes Bridge-Network, Service-Namen sind hostnames
# ------------------------------------------------------------------
networks:
  pqc-net:
    name: pqc-net
    driver: bridge
