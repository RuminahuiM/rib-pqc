# Implementing PQC - Docker Compose Skeleton
# ------------------------------------------------------------------
# Story: PQC-17 (INF-3) - Docker-Compose-Skeleton mit drei Services
# Bezug: docs/07_design.md Abschnitt 3.1, docs/06_tech_stack.md Abschnitt 2.1
#
# Status Sprint 1:
#   - Drei Services laufen (nginx Placeholder, auth-service Placeholder, redis).
#   - nginx ist stock nginx:1.27-alpine ohne TLS und ohne oqs-provider.
#     Der Custom-Build mit OpenSSL 3.5 plus oqs-provider folgt in PQC-18 (INF-4).
#   - auth-service ist ein Inline-Python-3.12-Placeholder, der einen Hello-Endpoint
#     auf Port 8000 ausliefert. Das echte FastAPI-Skeleton kommt aus PQC-19 (SKL-1)
#     und ersetzt dann das image plus command durch einen build-Kontext.
#   - Persistente Volumes auth-data und redis-data sind angelegt.
#
# Quickstart:
#   cd infra
#   cp .env.example .env
#   docker compose up --build
#   curl http://localhost:8080/             # nginx reverse proxy zum auth-service Placeholder
#   curl http://localhost:8080/health       # liefert JSON vom Placeholder
# ------------------------------------------------------------------

name: pqc

services:

  # ----------------------------------------------------------------
  # nginx - Reverse Proxy
  # Sprint 1: stock nginx:1.27-alpine ohne TLS. INF-4 ersetzt das Image
  # durch einen Custom-Build mit oqs-provider und schaltet TLS auf 443 frei.
  # ----------------------------------------------------------------
  nginx:
    image: nginx:1.27-alpine
    container_name: pqc-nginx
    restart: unless-stopped
    ports:
      - "${NGINX_HTTP_PORT:-8080}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      auth-service:
        condition: service_healthy
    networks:
      - pqc-net
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:80/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  # ----------------------------------------------------------------
  # auth-service - FastAPI (Placeholder bis SKL-1 abgeschlossen)
  # Sprint 1: Inline-Python-Placeholder via command. SKL-1 (PQC-19)
  # ersetzt image plus command durch build: ../server mit echtem Dockerfile.
  # ----------------------------------------------------------------
  auth-service:
    image: python:3.12-slim
    container_name: pqc-auth-service
    restart: unless-stopped
    working_dir: /app
    volumes:
      - auth-data:/data
    environment:
      REDIS_URL: redis://redis:6379/0
      SQLITE_PATH: /data/auth.sqlite
      PLACEHOLDER_NOTE: "PQC-17 INF-3 placeholder. Wird durch PQC-19 SKL-1 ersetzt."
    command:
      - python
      - -c
      - |
        import json, os
        from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer

        BODY = {
            "service": "auth-service",
            "status": "placeholder",
            "story": "PQC-17 INF-3",
            "note": "Replaced by PQC-19 SKL-1",
            "python": "3.12",
            "env": {
                "REDIS_URL": os.environ.get("REDIS_URL"),
                "SQLITE_PATH": os.environ.get("SQLITE_PATH"),
            },
        }

        class H(BaseHTTPRequestHandler):
            def do_GET(self):
                self.send_response(200)
                self.send_header("Content-Type", "application/json")
                self.end_headers()
                self.wfile.write(json.dumps(BODY).encode())

            def log_message(self, *args, **kwargs):
                pass

        print("auth-service placeholder listening on :8000", flush=True)
        ThreadingHTTPServer(("", 8000), H).serve_forever()
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - pqc-net
    healthcheck:
      test:
        - "CMD"
        - "python"
        - "-c"
        - "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health',timeout=2).status==200 else 1)"
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  # ----------------------------------------------------------------
  # redis - Session-Store
  # Sprint 1: stock redis:7-alpine mit AOF Persistenz auf redis-data Volume.
  # ----------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: pqc-redis
    restart: unless-stopped
    command:
      - "redis-server"
      - "--appendonly"
      - "yes"
      - "--appendfsync"
      - "everysec"
    volumes:
      - redis-data:/data
    networks:
      - pqc-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 3s

# ------------------------------------------------------------------
# Volumes - persistente Datenhaltung ueber Container-Restarts
# ------------------------------------------------------------------
volumes:
  auth-data:
    name: pqc-auth-data
  redis-data:
    name: pqc-redis-data

# ------------------------------------------------------------------
# Networks - eigenes Bridge-Network, Service-Namen sind hostnames
# ------------------------------------------------------------------
networks:
  pqc-net:
    name: pqc-net
    driver: bridge
